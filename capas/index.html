<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Arquivos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 2rem 1rem; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
        header p { color: var(--text-muted); font-size: 0.9rem; }
        .catalog-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .search-wrapper { position: relative; margin-bottom: 1.5rem; }
        .search-wrapper i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .file-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; min-height: 200px; }
        .file-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; display: flex; align-items: center; transition: all 0.2s; }
        .file-item:hover { border-color: var(--primary); background: #fff; transform: translateY(-1px); }
        .file-link { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 0.75rem; width: 100%; word-break: break-all; }
        .file-link i { color: var(--primary); font-size: 1.1rem; flex-shrink: 0; }
        .pagination { display: flex; justify-content: center; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
        .page-btn { padding: 0.4rem 0.75rem; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; color: var(--text-main); transition: background 0.2s; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-ellipsis { padding: 0.4rem 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .no-results { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 3rem; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Capas de Jogos</h1>
        <p>Lista completa de capas disponíveis</p>
    </header>
    <div class="catalog-box">
        <div class="search-wrapper">

        </div>
        <ul id="fileList" class="file-list"></ul>
        <div id="pagination" class="pagination"></div>
    </div>
</div>

const itensPorPagina = 30;
let paginaAtual = 1;
let arquivosFiltrados = [...todosArquivos];

function renderizar() {
    const lista = document.getElementById('fileList');
    const paginacaoDiv = document.getElementById('pagination');
    lista.innerHTML = '';

    if (arquivosFiltrados.length === 0) {
        lista.innerHTML = '<div class="no-results"><i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>Nenhum arquivo encontrado.</div>';
        paginacaoDiv.innerHTML = '';
        return;
    }

    const inicio = (paginaAtual - 1) * itensPorPagina;
    const fim = inicio + itensPorPagina;
    const itensPagina = arquivosFiltrados.slice(inicio, fim);

    itensPagina.forEach(arq => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.innerHTML = `<a href="${arq.displayFileUrl}" ${arq.downloadAttr ? 'download="' + arq.fullName.split('/').pop() + '"' : 'target="_blank"'} class="file-link" title="${arq.fullName}">
            <i class="fa-regular fa-file-lines"></i>
            <span>${arq.fullName}</span>
        </a>`;
        lista.appendChild(li);
    });

    renderizarPaginacao();
}

function renderizarPaginacao() {
    const paginacaoDiv = document.getElementById('pagination');
    paginacaoDiv.innerHTML = '';
    const totalPaginas = Math.ceil(arquivosFiltrados.length / itensPorPagina);

    if (totalPaginas <= 1) return;

    const btnAnterior = document.createElement('button');
    btnAnterior.className = 'page-btn';
    btnAnterior.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    btnAnterior.disabled = paginaAtual === 1;
    btnAnterior.onclick = () => { if (paginaAtual > 1) { paginaAtual--; renderizar(); } };
    paginacaoDiv.appendChild(btnAnterior);

    let paginasParaMostrar = [];
    if (totalPaginas <= 10) {
        for (let i = 1; i <= totalPaginas; i++) paginasParaMostrar.push(i);
    } else {
        paginasParaMostrar.push(1);
        let inicioJanela = Math.max(2, paginaAtual - 2);
        let fimJanela = Math.min(totalPaginas - 1, paginaAtual + 2);

        if (paginaAtual <= 4) {
            fimJanela = Math.min(totalPaginas - 1, 8);
        }
        if (paginaAtual >= totalPaginas - 3) {
            inicioJanela = Math.max(2, totalPaginas - 7);
        }

        if (inicioJanela > 2) {
            paginasParaMostrar.push('...');
        }

        for (let i = inicioJanela; i <= fimJanela; i++) {
            paginasParaMostrar.push(i);
        }

        if (fimJanela < totalPaginas - 1) {
            paginasParaMostrar.push('...');
        }

        paginasParaMostrar.push(totalPaginas);
    }

    paginasParaMostrar.forEach(p => {
        if (p === '...') {
            const span = document.createElement('span');
            span.className = 'page-ellipsis';
            span.innerText = '...';
            paginacaoDiv.appendChild(span);
        } else {
            const btn = document.createElement('button');
            btn.className = `page-btn ${p === paginaAtual ? 'active' : ''}`;
            btn.innerText = p;
            btn.onclick = () => { paginaAtual = p; renderizar(); };
            paginacaoDiv.appendChild(btn);
        }
    });

    const btnProximo = document.createElement('button');
    btnProximo.className = 'page-btn';
    btnProximo.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    btnProximo.disabled = paginaAtual === totalPaginas;
    btnProximo.onclick = () => { if (paginaAtual < totalPaginas) { paginaAtual++; renderizar(); } };
    paginacaoDiv.appendChild(btnProximo);
}

function filtrarEExibir() {
    const termo = document.getElementById('searchInput').value.toLowerCase();
    arquivosFiltrados = todosArquivos.filter(arq => arq.fullName.toLowerCase().includes(termo));
    paginaAtual = 1;
    renderizar();
}

renderizar();
</script>
